<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tự Luận Tin Học Lớp 3</title>
    <link rel="stylesheet" href="tuluan.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📝 TỰ LUẬN TIN HỌC LỚP 3</h1>
            <p>Đề cương ôn tập cuối học kỳ II</p>
        </div>

        <div class="content">
            <!-- Các câu hỏi sẽ được tạo động bằng JavaScript -->

            <!-- Submit All Button -->
            <button class="submit-all-btn" onclick="submitAll()">Nộp bài và xem điểm</button>

            <!-- Score Display -->
            <div class="score-display" id="score-display">
                <h3>🎯 Kết quả của em</h3>
                <p id="score-text"></p>
            </div>

            <!-- Navigation -->
            <div class="navigation">
                <a href="../index.html" class="nav-btn secondary">🏠 Trang chủ</a>
            </div>
        </div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <button class="close-sidebar-btn" onclick="toggleSidebar()">×</button>
            <h3>📋 Danh sách câu hỏi</h3>
            <div class="stats-summary" id="statsSummary">
                <div class="stat-item">✅ <span id="answeredCount">0</span></div>
                <div class="stat-item">⚠️ <span id="unansweredCount">4</span></div>
            </div>
        </div>
        <div class="sidebar-content" id="sidebarContent">
            <!-- Danh sách câu hỏi sẽ được tạo bằng JavaScript -->
        </div>
    </div>

    <!-- Toggle Button -->
    <button class="toggle-sidebar-btn" id="toggleBtn" onclick="toggleSidebar()">
        📊
    </button>

    <script src="tuluan.js"></script>
</body>
</html>
