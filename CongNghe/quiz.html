<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trắc Nghiệm Công Nghệ Lớp 3</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 16px;
            opacity: 0.9;
        }

        .quiz-content {
            padding: 30px;
        }

        .question-card {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 20%, #fff 20%);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .question-card:hover {
            transform: translateY(-5px);
        }

        .question-number {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .question-text {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .question-image {
            max-width: 100%;
            height: auto;
            margin: 15px 0;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 15px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .option:hover {
            border-color: #667eea;
            background: #f8f9ff;
            transform: translateX(5px);
        }

        .option input[type="radio"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .option-text {
            flex: 1;
            font-size: 16px;
            color: #555;
        }

        .option.correct {
            background: #d4edda;
            border-color: #28a745;
        }

        .option.incorrect {
            background: #f8d7da;
            border-color: #dc3545;
        }

        .option.disabled {
            pointer-events: none;
            opacity: 0.7;
        }

        .submit-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            display: block;
            margin: 30px auto;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.6);
        }

        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            box-shadow: none;
        }

        .result-box {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            border-radius: 15px;
            padding: 25px;
            margin: 20px 0;
            text-align: center;
            display: none;
        }

        .result-box.show {
            display: block;
            animation: slideDown 0.5s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-box h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 24px;
        }

        .score {
            font-size: 48px;
            font-weight: bold;
            color: #667eea;
            margin: 15px 0;
        }

        .result-message {
            font-size: 18px;
            color: #555;
            margin-top: 10px;
        }

        .reset-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s ease;
        }

        .reset-btn:hover {
            transform: scale(1.05);
        }

        .navigation {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
            padding: 20px;
        }

        .nav-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .nav-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .nav-btn.secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .sidebar {
            position: fixed;
            right: -300px;
            top: 0;
            width: 300px;
            height: 100vh;
            background: white;
            box-shadow: -5px 0 15px rgba(0, 0, 0, 0.2);
            transition: right 0.3s ease;
            z-index: 1000;
            overflow-y: auto;
        }

        .sidebar.open {
            right: 0;
        }

        .sidebar-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .sidebar-header h3 {
            margin: 0 0 10px 0;
            font-size: 18px;
        }

        .sidebar-filters {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .filter-btn {
            flex: 1;
            padding: 8px;
            border: 1px solid white;
            background: transparent;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .filter-btn:hover, .filter-btn.active {
            background: white;
            color: #667eea;
        }

        .sidebar-content {
            padding: 15px;
        }

        .question-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid #e0e0e0;
        }

        .question-item:hover {
            background: #f8f9ff;
            transform: translateX(-5px);
        }

        .question-item.correct {
            background: #d4edda;
            border-color: #28a745;
        }

        .question-item.incorrect {
            background: #f8d7da;
            border-color: #dc3545;
        }

        .question-item.unanswered {
            background: #fff3cd;
            border-color: #ffc107;
        }

        .question-number-badge {
            min-width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #667eea;
            color: white;
            border-radius: 50%;
            font-weight: bold;
            font-size: 14px;
        }

        .question-item.correct .question-number-badge {
            background: #28a745;
        }

        .question-item.incorrect .question-number-badge {
            background: #dc3545;
        }

        .question-item.unanswered .question-number-badge {
            background: #ffc107;
        }

        .question-status {
            flex: 1;
            font-size: 14px;
            color: #555;
        }

        .question-icon {
            font-size: 18px;
        }

        .toggle-sidebar-btn {
            position: fixed;
            right: 20px;
            bottom: 20px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toggle-sidebar-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.6);
        }

        .close-sidebar-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: transparent;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background 0.3s ease;
        }

        .close-sidebar-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .stats-summary {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            font-size: 13px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 22px;
            }

            .question-text {
                font-size: 16px;
            }

            .quiz-content {
                padding: 20px;
            }

            .navigation {
                flex-direction: column;
            }

            .sidebar {
                width: 280px;
                right: -280px;
            }

            .toggle-sidebar-btn {
                width: 50px;
                height: 50px;
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 TRẮC NGHIỆM CÔNG NGHỆ LỚP 3</h1>
            <p>Đề cương ôn tập cuối học kỳ II</p>
        </div>

        <div class="quiz-content">
            <div class="result-box" id="resultBox">
                <h2>🎉 KẾT QUẢ BÀI LÀM</h2>
                <div class="score" id="scoreDisplay">0/26</div>
                <div class="result-message" id="resultMessage"></div>
                <button class="reset-btn" onclick="resetQuiz()">Làm lại</button>
            </div>

            <form id="quizForm">
                <!-- Câu hỏi sẽ được tạo động bằng JavaScript -->
            </form>

            <button type="button" class="submit-btn" id="submitBtn" onclick="submitQuiz()">Nộp bài</button>

            <!-- Navigation -->
            <div class="navigation">
                <a href="TuLuan/tuluan.html" class="nav-btn">→ Tự luận</a>
                <a href="index.html" class="nav-btn secondary">🏠 Trang chủ</a>
            </div>
        </div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <button class="close-sidebar-btn" onclick="toggleSidebar()">×</button>
            <h3>📋 Danh sách câu hỏi</h3>
            <div class="stats-summary" id="statsSummary">
                <div class="stat-item">✅ <span id="correctCount">0</span></div>
                <div class="stat-item">❌ <span id="incorrectCount">0</span></div>
                <div class="stat-item">⚠️ <span id="unansweredCount">0</span></div>
            </div>
            <div class="sidebar-filters">
                <button class="filter-btn active" onclick="filterQuestions('all')">Tất cả</button>
                <button class="filter-btn" onclick="filterQuestions('incorrect')">Sai</button>
                <button class="filter-btn" onclick="filterQuestions('unanswered')">Chưa trả lời</button>
            </div>
        </div>
        <div class="sidebar-content" id="sidebarContent">
            <!-- Danh sách câu hỏi sẽ được tạo bằng JavaScript -->
        </div>
    </div>

    <!-- Toggle Button -->
    <button class="toggle-sidebar-btn" id="toggleBtn" onclick="toggleSidebar()">
        📊
    </button>

    <script src="quiz_images.js"></script>
    <script src="quiz_script.js"></script>
</body>
</html>
