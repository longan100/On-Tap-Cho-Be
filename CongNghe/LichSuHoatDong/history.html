<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch Sử Học Tập - Công Nghệ Lớp 3</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 30px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
            position: relative;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 16px;
            opacity: 0.95;
        }

        .back-btn {
            position: absolute;
            left: 30px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-50%) scale(1.05);
        }

        .content {
            padding: 30px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 10px 20px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .filter-btn:hover {
            background: #f0f0f0;
        }

        .filter-btn.active {
            background: #667eea;
            color: white;
        }

        .delete-all-btn {
            padding: 10px 20px;
            background: #f44336;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .delete-all-btn:hover {
            background: #d32f2f;
            transform: scale(1.05);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .stat-card .number {
            font-size: 36px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .stat-card .label {
            font-size: 14px;
            color: #666;
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .history-table thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .history-table th {
            padding: 15px;
            text-align: left;
            font-weight: bold;
        }

        .history-table td {
            padding: 15px;
            border-bottom: 1px solid #f0f0f0;
        }

        .history-table tbody tr {
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .history-table tbody tr:hover {
            background: #f8f9fa;
            transform: scale(1.01);
        }

        .type-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            color: white;
        }

        .type-tracnghiem {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .type-tuluan {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            color: #333;
        }

        .type-kiemtra {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }

        .score-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-state .icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .empty-state h3 {
            font-size: 24px;
            color: #333;
            margin-bottom: 10px;
        }

        .empty-state p {
            font-size: 16px;
            color: #666;
            margin-bottom: 20px;
        }

        .empty-state .start-btn {
            display: inline-block;
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 15px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .empty-state .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .back-btn {
                position: static;
                transform: none;
                margin-bottom: 15px;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            .filter-buttons {
                justify-content: center;
            }

            .history-table {
                font-size: 12px;
            }

            .history-table th,
            .history-table td {
                padding: 10px 5px;
            }

            /* Ẩn một số cột trên mobile */
            .hide-mobile {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="./index.html" class="back-btn">← Quay lại</a>
            <h1>📚 Lịch Sử Học Tập</h1>
            <p>Xem lại các lần đã học và kết quả đạt được</p>
        </div>

        <div class="content">
            <!-- Thống kê -->
            <div class="stats" id="statsContainer">
                <div class="stat-card">
                    <div class="number" id="totalCount">0</div>
                    <div class="label">Tổng số lần học</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="avgScore">0%</div>
                    <div class="label">Điểm trung bình</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="bestScore">0%</div>
                    <div class="label">Điểm cao nhất</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="storageUsed">0%</div>
                    <div class="label">Bộ nhớ đã dùng</div>
                </div>
            </div>

            <!-- Thông báo bộ nhớ -->
            <div id="storageWarning" style="display: none; background: #fff3cd; border: 2px solid #ffc107; border-radius: 15px; padding: 15px; margin-bottom: 20px; text-align: center;">
                <strong>⚠️ Cảnh báo:</strong> Bộ nhớ gần đầy! Hệ thống sẽ tự động xóa lịch sử cũ nhất khi cần thiết.
            </div>

            <!-- Bộ lọc và nút xóa -->
            <div class="controls">
                <div class="filter-buttons">
                    <button class="filter-btn active" onclick="filterHistory('all')">
                        📄 Tất cả
                    </button>
                    <button class="filter-btn" onclick="filterHistory('tracnghiem')">
                        📝 Trắc nghiệm
                    </button>
                    <button class="filter-btn" onclick="filterHistory('tuluan')">
                        ✍️ Tự luận
                    </button>
                    <button class="filter-btn" onclick="filterHistory('kiemtra')">
                        🎯 Kiểm tra
                    </button>
                </div>
                <button class="delete-all-btn" onclick="deleteAllHistory()">
                    🗑️ Xóa tất cả
                </button>
            </div>

            <!-- Bảng lịch sử -->
            <div id="historyContainer">
                <!-- Sẽ được render bằng JavaScript -->
            </div>
        </div>
    </div>

    <script src="./history-manager.js"></script>
    <script>
        let currentFilter = 'all';

        // Khởi tạo trang
        function init() {
            loadHistory();
            updateStats();
        }

        // Tải và hiển thị lịch sử
        function loadHistory() {
            let history = HistoryManager.filterByType(currentFilter);
            history = HistoryManager.sortByDate(history, false); // Mới nhất trước

            const container = document.getElementById('historyContainer');

            if (history.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📭</div>
                        <h3>Chưa có lịch sử học tập</h3>
                        <p>Hãy bắt đầu làm bài để xem lịch sử tại đây!</p>
                        <a href="./index.html" class="start-btn">Bắt đầu học</a>
                    </div>
                `;
                return;
            }

            let tableHTML = `
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>Ngày giờ</th>
                            <th>Loại bài</th>
                            <th>Tổng câu</th>
                            <th class="hide-mobile">Câu đúng</th>
                            <th class="hide-mobile">Câu sai</th>
                            <th>Điểm số</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            history.forEach(item => {
                const percentage = HistoryManager.calculatePercentage(item.correctCount, item.totalQuestions);
                const scoreColor = HistoryManager.getScoreColor(percentage);
                const typeIcon = HistoryManager.getTypeIcon(item.type);
                const typeName = HistoryManager.getTypeName(item.type);

                tableHTML += `
                    <tr onclick="viewDetail('${item.id}')">
                        <td>${HistoryManager.formatDateTime(item.timestamp)}</td>
                        <td>
                            <span class="type-badge type-${item.type}">
                                ${typeIcon} ${typeName}
                            </span>
                        </td>
                        <td>${item.totalQuestions}</td>
                        <td class="hide-mobile">${item.correctCount}</td>
                        <td class="hide-mobile">${item.incorrectCount}</td>
                        <td>
                            <span class="score-badge" style="background: ${scoreColor}">
                                ${percentage}%
                            </span>
                        </td>
                    </tr>
                `;
            });

            tableHTML += `
                    </tbody>
                </table>
            `;

            container.innerHTML = tableHTML;
        }

        // Cập nhật thống kê
        function updateStats() {
            const history = HistoryManager.getAll();
            
            // Tổng số lần học
            document.getElementById('totalCount').textContent = history.length;

            if (history.length === 0) {
                document.getElementById('avgScore').textContent = '0%';
                document.getElementById('bestScore').textContent = '0%';
                document.getElementById('storageUsed').textContent = '0%';
                return;
            }

            // Tính điểm trung bình
            let totalPercentage = 0;
            let maxPercentage = 0;

            history.forEach(item => {
                const percentage = HistoryManager.calculatePercentage(item.correctCount, item.totalQuestions);
                totalPercentage += percentage;
                if (percentage > maxPercentage) {
                    maxPercentage = percentage;
                }
            });

            const avgPercentage = Math.round(totalPercentage / history.length);
            document.getElementById('avgScore').textContent = avgPercentage + '%';
            document.getElementById('bestScore').textContent = maxPercentage + '%';
            
            // Hiển thị thông tin bộ nhớ
            const storageInfo = HistoryManager.getStorageInfo();
            document.getElementById('storageUsed').textContent = storageInfo.percentUsed + '%';
            
            // Hiển thị cảnh báo nếu bộ nhớ > 80%
            const warningDiv = document.getElementById('storageWarning');
            if (parseFloat(storageInfo.percentUsed) > 80) {
                warningDiv.style.display = 'block';
                warningDiv.innerHTML = `
                    <strong>⚠️ Cảnh báo:</strong> Bộ nhớ đã dùng ${storageInfo.percentUsed}% 
                    (${storageInfo.count}/${storageInfo.maxCount} lịch sử, ${storageInfo.sizeInMB}/${storageInfo.maxSizeInMB} MB).
                    <br>Hệ thống sẽ tự động xóa lịch sử cũ nhất khi cần thiết.
                `;
            } else {
                warningDiv.style.display = 'none';
            }
        }

        // Lọc lịch sử
        function filterHistory(type) {
            currentFilter = type;

            // Cập nhật trạng thái nút
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            loadHistory();
        }

        // Xem chi tiết
        function viewDetail(id) {
            window.location.href = `./history-detail.html?id=${id}`;
        }

        // Xóa tất cả lịch sử
        function deleteAllHistory() {
            if (confirm('⚠️ Bạn có chắc chắn muốn xóa toàn bộ lịch sử học tập? Hành động này không thể hoàn tác!')) {
                HistoryManager.deleteAll();
                init();
            }
        }

        // Khởi tạo khi trang tải
        window.onload = init;
    </script>
</body>
</html>
