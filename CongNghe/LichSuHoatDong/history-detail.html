<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi Tiết Lịch Sử - Công Nghệ Lớp 3</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 30px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
            position: relative;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.95;
        }

        .back-btn {
            position: absolute;
            left: 30px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-50%) scale(1.05);
        }

        .content {
            padding: 30px;
        }

        .summary-card {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .summary-item {
            text-align: center;
        }

        .summary-item .label {
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
        }

        .summary-item .value {
            font-size: 28px;
            font-weight: bold;
            color: #333;
        }

        .summary-item .icon {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .rating {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 15px;
        }

        .section-title {
            font-size: 24px;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #667eea;
        }

        .question-detail {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }

        .question-detail.correct {
            border-left: 5px solid #4caf50;
        }

        .question-detail.incorrect {
            border-left: 5px solid #f44336;
        }

        .question-detail.partial {
            border-left: 5px solid #ff9800;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .question-number {
            font-size: 18px;
            font-weight: bold;
            color: #667eea;
        }

        .question-status {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            color: white;
        }

        .status-correct {
            background: #4caf50;
        }

        .status-incorrect {
            background: #f44336;
        }

        .status-partial {
            background: #ff9800;
        }

        .question-text {
            font-size: 16px;
            color: #333;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .question-image {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            margin: 15px 0;
        }

        .answer-section {
            margin-top: 15px;
        }

        .answer-label {
            font-size: 14px;
            font-weight: bold;
            color: #666;
            margin-bottom: 5px;
        }

        .answer-text {
            font-size: 15px;
            color: #333;
            padding: 10px;
            background: white;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .answer-text.correct {
            background: #e8f5e9;
            border: 2px solid #4caf50;
        }

        .answer-text.incorrect {
            background: #ffebee;
            border: 2px solid #f44336;
        }

        .options-list {
            list-style: none;
            padding: 0;
        }

        .options-list li {
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 10px;
            background: white;
        }

        .options-list li.selected {
            background: #e3f2fd;
            border: 2px solid #2196f3;
        }

        .options-list li.correct-answer {
            background: #e8f5e9;
            border: 2px solid #4caf50;
            font-weight: bold;
        }

        .delete-btn {
            display: block;
            width: 100%;
            padding: 15px;
            background: #f44336;
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 30px;
            transition: all 0.3s ease;
        }

        .delete-btn:hover {
            background: #d32f2f;
            transform: scale(1.02);
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 20px;
            }

            .back-btn {
                position: static;
                transform: none;
                margin-bottom: 15px;
            }

            .summary-grid {
                grid-template-columns: 1fr 1fr;
            }

            .content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="./history.html" class="back-btn">← Quay lại</a>
            <h1 id="headerTitle">Chi Tiết Lịch Sử</h1>
            <p id="headerSubtitle"></p>
        </div>

        <div class="content">
            <!-- Tóm tắt kết quả -->
            <div class="summary-card">
                <h2 style="text-align: center; color: #333; margin-bottom: 10px;">Kết Quả</h2>
                <div class="summary-grid" id="summaryGrid">
                    <!-- Sẽ được render bằng JavaScript -->
                </div>
                <div class="rating" id="rating">
                    <!-- Sẽ được render bằng JavaScript -->
                </div>
            </div>

            <!-- Chi tiết từng câu hỏi -->
            <h2 class="section-title">📋 Chi Tiết Từng Câu</h2>
            <div id="questionsContainer">
                <!-- Sẽ được render bằng JavaScript -->
            </div>

            <!-- Nút xóa -->
            <button class="delete-btn" onclick="deleteThisHistory()">
                🗑️ Xóa lịch sử này
            </button>
        </div>
    </div>

    <script src="./history-manager.js"></script>
    <script>
        let currentHistoryId = null;

        // Khởi tạo trang
        function init() {
            // Lấy ID từ URL
            const urlParams = new URLSearchParams(window.location.search);
            currentHistoryId = urlParams.get('id');

            if (!currentHistoryId) {
                alert('Không tìm thấy lịch sử!');
                window.location.href = './history.html';
                return;
            }

            // Lấy dữ liệu lịch sử
            const history = HistoryManager.getById(currentHistoryId);

            if (!history) {
                alert('Lịch sử không tồn tại!');
                window.location.href = './history.html';
                return;
            }

            // Hiển thị dữ liệu
            renderHeader(history);
            renderSummary(history);
            renderQuestions(history);
        }

        // Render header
        function renderHeader(history) {
            const typeIcon = HistoryManager.getTypeIcon(history.type);
            const typeName = HistoryManager.getTypeName(history.type);
            const dateTime = HistoryManager.formatDateTime(history.timestamp);

            document.getElementById('headerTitle').textContent = `${typeIcon} ${typeName}`;
            document.getElementById('headerSubtitle').textContent = dateTime;
        }

        // Render tóm tắt
        function renderSummary(history) {
            const percentage = HistoryManager.calculatePercentage(history.correctCount, history.totalQuestions);
            const rating = HistoryManager.getScoreRating(percentage);

            const summaryHTML = `
                <div class="summary-item">
                    <div class="icon">📊</div>
                    <div class="label">Tổng số câu</div>
                    <div class="value">${history.totalQuestions}</div>
                </div>
                <div class="summary-item">
                    <div class="icon">✅</div>
                    <div class="label">Câu đúng</div>
                    <div class="value">${history.correctCount}</div>
                </div>
                <div class="summary-item">
                    <div class="icon">❌</div>
                    <div class="label">Câu sai</div>
                    <div class="value">${history.incorrectCount}</div>
                </div>
                <div class="summary-item">
                    <div class="icon">🎯</div>
                    <div class="label">Điểm số</div>
                    <div class="value">${percentage}%</div>
                </div>
            `;

            document.getElementById('summaryGrid').innerHTML = summaryHTML;
            document.getElementById('rating').textContent = rating;
        }

        // Render chi tiết câu hỏi
        function renderQuestions(history) {
            const container = document.getElementById('questionsContainer');
            let html = '';

            history.questions.forEach((q, index) => {
                const statusClass = q.isCorrect ? 'correct' : (q.isPartial ? 'partial' : 'incorrect');
                const statusText = q.isCorrect ? 'Đúng' : (q.isPartial ? 'Được một phần' : 'Sai');
                const statusBadgeClass = q.isCorrect ? 'status-correct' : (q.isPartial ? 'status-partial' : 'status-incorrect');

                html += `
                    <div class="question-detail ${statusClass}">
                        <div class="question-header">
                            <span class="question-number">Câu ${index + 1}</span>
                            <span class="question-status ${statusBadgeClass}">${statusText}</span>
                        </div>
                        <div class="question-text">${q.question}</div>
                `;

                // Hiển thị hình ảnh nếu có
                if (q.imageUrl) {
                    html += `<img src="${q.imageUrl}" class="question-image" alt="Hình minh họa">`;
                }

                // Hiển thị đáp án tùy theo loại câu hỏi
                if (q.type === 'tracnghiem') {
                    // Trắc nghiệm - hiển thị các options
                    html += '<div class="answer-section">';
                    html += '<div class="answer-label">Các đáp án:</div>';
                    html += '<ul class="options-list">';

                    q.options.forEach((opt, optIndex) => {
                        const letter = String.fromCharCode(65 + optIndex);
                        let optClass = '';
                        
                        if (Array.isArray(q.correctAnswer)) {
                            // Câu hỏi nhiều đáp án
                            if (q.correctAnswer.includes(optIndex)) {
                                optClass = 'correct-answer';
                            } else if (q.userAnswer && q.userAnswer.includes(optIndex)) {
                                optClass = 'selected';
                            }
                        } else {
                            // Câu hỏi đơn
                            if (optIndex === q.correctAnswer) {
                                optClass = 'correct-answer';
                            } else if (optIndex === q.userAnswer) {
                                optClass = 'selected';
                            }
                        }

                        html += `<li class="${optClass}">${letter}. ${opt}</li>`;
                    });

                    html += '</ul>';
                    html += '</div>';
                } else if (q.type === 'tuluan') {
                    // Tự luận - hiển thị câu trả lời
                    html += '<div class="answer-section">';
                    html += '<div class="answer-label">Câu trả lời của em:</div>';
                    html += `<div class="answer-text ${q.isCorrect ? 'correct' : 'incorrect'}">${q.userAnswer || '(Chưa trả lời)'}</div>`;
                    
                    if (!q.isCorrect && q.correctAnswer) {
                        html += '<div class="answer-label">💡 Đáp án gợi ý:</div>';
                        html += `<div class="answer-text correct">${q.correctAnswer}</div>`;
                    }
                    
                    html += '</div>';
                }

                html += '</div>';
            });

            container.innerHTML = html;
        }

        // Xóa lịch sử này
        function deleteThisHistory() {
            if (confirm('⚠️ Bạn có chắc chắn muốn xóa lịch sử này?')) {
                HistoryManager.delete(currentHistoryId);
                alert('✅ Đã xóa lịch sử!');
                window.location.href = './history.html';
            }
        }

        // Khởi tạo khi trang tải
        window.onload = init;
    </script>
</body>
</html>
