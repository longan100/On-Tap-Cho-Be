<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module 2: Bốn Phép Tính - Toán Lớp 3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/custom.css">
</head>
<body class="min-h-screen font-['Baloo_2']" style="background: linear-gradient(135deg,#fff 0%,#e0f2fe 100%)">
    
    <!-- Header -->
    <header class="bg-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4">
            <div class="flex items-center justify-between mb-3">
                <a href="../index.html" class="text-sky-500 hover:text-sky-600 font-bold">← Quay lại</a>
                <h1 class="text-xl md:text-2xl font-bold text-sky-600">Module 2: Bốn Phép Tính</h1>
                <div class="flex items-center gap-2">
                    <span class="text-2xl">⭐</span>
                    <span id="totalStars" class="text-xl font-bold text-amber-500">0</span>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <div class="flex-1 bg-gray-200 rounded-full h-3">
                    <div class="module-progress-bar bg-sky-400 h-3 rounded-full transition-all" style="width: 0%"></div>
                </div>
                <span class="module-progress-text text-sm font-bold text-slate-600">0/8 câu</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8 max-w-3xl">
        
        <!-- Exercise Card -->
        <div class="bg-white rounded-2xl shadow-lg p-6 md:p-8">
            
            <!-- Question -->
            <div class="mb-6">
                <div class="flex items-center justify-between mb-4">
                    <span class="text-sm font-bold text-slate-500">Câu <span id="currentQuestion">1</span>/12</span>
                    <span class="text-sm font-bold text-sky-500" id="questionType">Phép cộng</span>
                </div>
                
                <!-- Vertical calculation display -->
                <div id="calculationDisplay" class="text-center mb-6">
                    <!-- Will be populated by JS -->
                </div>
            </div>

            <!-- Answer Input -->
            <div class="mb-6">
                <input type="number" id="answerInput" 
                       class="input-answer w-full" 
                       placeholder="Nhập kết quả..."
                       autocomplete="off">
                <div id="remainderInput" class="mt-3 hidden">
                    <label class="text-sm font-bold text-slate-600 mb-2 block">Số dư (nếu có):</label>
                    <input type="number" id="remainderValue" 
                           class="input-answer w-full" 
                           placeholder="Nhập số dư..."
                           autocomplete="off">
                </div>
            </div>

            <!-- Buttons -->
            <div class="flex flex-wrap gap-3 mb-6">
                <button onclick="checkAnswer()" class="flex-1 btn-primary">
                    ✅ Kiểm tra
                </button>
                <button onclick="showHint()" class="flex-1 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-xl px-6 py-3 transition">
                    💡 Xem đáp án
                </button>
            </div>

            <!-- Feedback -->
            <div id="feedback" class="hidden"></div>

        </div>

        <!-- Stats -->
        <div class="mt-6 grid grid-cols-3 gap-4">
            <div class="bg-white rounded-xl shadow p-4 text-center">
                <div class="text-3xl font-bold text-green-500" id="correctCount">0</div>
                <div class="text-sm text-slate-600">Đúng</div>
            </div>
            <div class="bg-white rounded-xl shadow p-4 text-center">
                <div class="text-3xl font-bold text-red-500" id="incorrectCount">0</div>
                <div class="text-sm text-slate-600">Sai</div>
            </div>
            <div class="bg-white rounded-xl shadow p-4 text-center">
                <div class="text-3xl font-bold text-amber-500" id="starsEarned">0</div>
                <div class="text-sm text-slate-600">Sao</div>
            </div>
        </div>

    </main>

    <script src="../js/config.js"></script>
    <script src="../js/progress.js"></script>
    <script src="../js/generator.js"></script>
    <script src="../js/ai.js"></script>
    <script src="../js/ui.js"></script>
    <script>
        const MODULE_ID = '02-bon-phep-tinh';
        const TOTAL_QUESTIONS = 8;  // 4 phép tính × 2 lần = 8 câu
        
        let currentQuestionIndex = 0;
        let correctCount = 0;
        let incorrectCount = 0;
        let starsEarned = 0;
        let currentQuestion = null;
        let attempts = 0;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            updateHeaderStats();
            loadQuestion();
            
            // Enter key to check answer
            document.getElementById('answerInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') checkAnswer();
            });
        });

        function loadQuestion() {
            attempts = 0;
            document.getElementById('feedback').classList.add('hidden');
            document.getElementById('answerInput').value = '';
            document.getElementById('answerInput').className = 'input-answer w-full';
            
            // Xoay vòng 4 phép tính, mỗi phép 2 lần
            const operations = ['cong', 'tru', 'nhan', 'chia'];
            const opType = operations[currentQuestionIndex % 4];
            
            switch(opType) {
                case 'cong':
                    currentQuestion = sinhPhepCong();
                    currentQuestion.typeName = 'Phép cộng';
                    break;
                case 'tru':
                    currentQuestion = sinhPhepTru();
                    currentQuestion.typeName = 'Phép trừ';
                    break;
                case 'nhan':
                    currentQuestion = sinhPhepNhan();
                    currentQuestion.typeName = 'Phép nhân';
                    break;
                case 'chia':
                    const coDu = Math.random() > 0.5;
                    currentQuestion = sinhPhepChia(coDu);
                    currentQuestion.typeName = 'Phép chia';
                    break;
            }
            
            document.getElementById('currentQuestion').textContent = currentQuestionIndex + 1;
            document.getElementById('questionType').textContent = currentQuestion.typeName;
            
            displayCalculation();
            updateProgressBar();
            
            // Show/hide remainder input for division
            if (currentQuestion.phep === '÷') {
                document.getElementById('remainderInput').classList.remove('hidden');
                document.getElementById('remainderValue').value = '';
            } else {
                document.getElementById('remainderInput').classList.add('hidden');
            }
        }

        function displayCalculation() {
            const display = document.getElementById('calculationDisplay');
            const { a, b, phep } = currentQuestion;
            
            // Format numbers with spacing
            const aStr = formatNumber(a);
            const bStr = formatNumber(b);
            
            display.innerHTML = `
                <div class="inline-block text-left font-mono">
                    <div class="text-3xl md:text-4xl font-bold text-slate-800 mb-2 text-right">
                        ${aStr}
                    </div>
                    <div class="text-3xl md:text-4xl font-bold text-sky-500 mb-2 text-right border-b-4 border-slate-300 pb-2">
                        <span class="mr-4">${phep}</span> ${bStr}
                    </div>
                    <div class="text-2xl text-slate-400 mt-2 text-right">
                        = ?
                    </div>
                </div>
            `;
        }

        function checkAnswer() {
            const input = document.getElementById('answerInput');
            const userAnswer = parseInt(input.value.trim());
            
            if (isNaN(userAnswer)) {
                showToast('Hãy nhập kết quả nhé!', 'error');
                return;
            }
            
            attempts++;
            let isCorrect = false;
            
            // Check division with remainder
            if (currentQuestion.phep === '÷') {
                const remainderInput = document.getElementById('remainderValue');
                const userRemainder = parseInt(remainderInput.value.trim()) || 0;
                isCorrect = (userAnswer === currentQuestion.dapAn) && (userRemainder === (currentQuestion.du || 0));
            } else {
                isCorrect = userAnswer === currentQuestion.dapAn;
            }
            
            const feedback = document.getElementById('feedback');
            
            if (isCorrect) {
                input.className = 'input-answer w-full correct';
                feedback.className = 'feedback-box success';
                feedback.innerHTML = `
                    <div class="text-xl font-bold mb-2">🎉 Chính xác!</div>
                    <div>${currentQuestion.phepTinh} = ${currentQuestion.dapAn}${currentQuestion.du ? ` (dư ${currentQuestion.du})` : ''}</div>
                `;
                feedback.classList.remove('hidden');
                
                correctCount++;
                
                // Award stars
                let stars = 0;
                if (attempts === 1) stars = 3;
                else if (attempts === 2) stars = 2;
                else stars = 1;
                
                starsEarned += stars;
                showStars(stars);
                playSound('correct');
                
                updateStats();
                
                // Next question
                setTimeout(() => {
                    currentQuestionIndex++;
                    if (currentQuestionIndex < TOTAL_QUESTIONS) {
                        loadQuestion();
                    } else {
                        finishModule();
                    }
                }, 2000);
                
            } else {
                input.className = 'input-answer w-full incorrect';
                feedback.className = 'feedback-box error';
                feedback.innerHTML = `
                    <div class="text-xl font-bold mb-2">❌ Chưa đúng</div>
                    <div>Kiểm tra lại phép tính nhé! Hoặc bấm "Gợi ý AI".</div>
                `;
                feedback.classList.remove('hidden');
                
                incorrectCount++;
                playSound('incorrect');
                updateStats();
            }
        }

        function showHint() {
            if (!currentQuestion) return;
            
            let answerText = formatNumber(currentQuestion.dapAn);
            let explanation = '';
            
            if (currentQuestion.du) {
                answerText += ` (dư ${currentQuestion.du})`;
                explanation = 'Phép chia có dư: Số bị chia = Thương × Số chia + Số dư';
            } else {
                explanation = `${currentQuestion.phepTinh} = ${currentQuestion.dapAn}`;
            }
            
            showAnswer(answerText, explanation);
        }

        function updateStats() {
            document.getElementById('correctCount').textContent = correctCount;
            document.getElementById('incorrectCount').textContent = incorrectCount;
            document.getElementById('starsEarned').textContent = starsEarned;
        }

        function updateProgressBar() {
            const percent = Math.round((currentQuestionIndex / TOTAL_QUESTIONS) * 100);
            document.querySelector('.module-progress-bar').style.width = percent + '%';
            document.querySelector('.module-progress-text').textContent = `${currentQuestionIndex}/${TOTAL_QUESTIONS} câu`;
        }

        function finishModule() {
            saveProgress(MODULE_ID, correctCount, TOTAL_QUESTIONS, starsEarned);
            
            showConfetti();
            
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.innerHTML = `
                <div class="modal-content text-center">
                    <div class="text-6xl mb-4">🎉</div>
                    <h2 class="text-3xl font-bold text-slate-800 mb-4">Hoàn thành!</h2>
                    <div class="text-xl text-slate-600 mb-6">
                        Bé đã hoàn thành Module 2<br>
                        <span class="text-sky-500 font-bold">${correctCount}/${TOTAL_QUESTIONS}</span> câu đúng<br>
                        Nhận được <span class="text-amber-500 font-bold">${starsEarned} ⭐</span>
                    </div>
                    <div class="flex gap-3">
                        <a href="../index.html" class="flex-1 bg-gray-300 hover:bg-gray-400 text-slate-700 font-bold rounded-xl px-6 py-3 transition text-center">
                            Về trang chủ
                        </a>
                        <button onclick="location.reload()" class="flex-1 bg-sky-400 hover:bg-sky-500 text-white font-bold rounded-xl px-6 py-3 transition">
                            Làm lại
                        </button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);
        }
    </script>
</body>
</html>
