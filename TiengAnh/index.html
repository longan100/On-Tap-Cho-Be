        /** Khóa duy nhất mỗi dòng từ (cần khi trùng en khác nghĩa, vd hai "short") */
        function getWordKey(w) {
            return w.wordId != null ? w.wordId : w.en;
        }

        function shuffleArray(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        /** Chuẩn hóa & so khớp tiếng Việt linh hoạt hơn cho bài "Viết Việt" */
        function collapseSpacesVi(s) {
            return String(s).trim().toLowerCase().replace(/\s+/g, ' ');
        }

        function stripVietnameseTones(s) {
            return collapseSpacesVi(s)
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .replace(/đ/g, 'd');
        }

        const VI_OPTIONAL_PREFIX = /^(cái|con|quả|ngôi|đôi|bức|cục|số)\s+/;

        function stripOptionalClassifier(s) {
            let t = collapseSpacesVi(s);
            let prev;
            do {
                prev = t;
                t = t.replace(VI_OPTIONAL_PREFIX, '').trim();
            } while (t !== prev);
            return t;
        }

        /** Tách các đáp án được phép từ trường vi (dấu / = lựa chọn thay thế) */
        function getViAcceptablePhrases(viField) {
            const raw = String(viField).trim();
            const bySlash = raw.split('/').map(p => p.trim()).filter(Boolean);
            const set = new Set();
            set.add(raw);
            bySlash.forEach(p => set.add(p));
            return [...set];
        }

        function isViClassifierToken(t) {
            const set = new Set(['con', 'cái', 'quả', 'ngôi', 'đôi', 'bức', 'cục', 'số', 'chiếc', 'màu']);
            return set.has(collapseSpacesVi(t));
        }

        /** Không rút gọn còn từ đầu (dễ nhầm hoặc quá chung) */
        const VI_BLOCK_FIRST_TOKEN_TONELESS = new Set(['di', 'nuoc']);

        /** Một số từ: từ đầu của cụm không nên là đáp án đúng (vd: quyển ≠ quyển sách) */
        const VI_DENY_FIRST_RELAX_EN = new Set(['book', 'square', 'share', 'pencil case']);

        /** Thêm đáp án thủ công theo en (đồng bộ dấu với từ điển khi có thể) */
        const VI_MANUAL_WRITE_EXTRA_BY_EN = {
            dance: ['nhảy nhót', 'khiêu vũ'],
            talk: ['nói'],
            catch: ['bắt'],
            'play soccer': ['đá banh', 'chơi bóng'],
            'take a photo': ['chụp hình', 'chụp hình ảnh'],
            'draw a picture': ['vẽ'],
            juice: ['nước ép', 'ép trái cây'],
            watch: ['xem tivi', 'coi'],
            sing: ['ca hát'],
        };

        function viCandidateMatchesUser(user, userNoTone, userStripped, cand) {
            const c = collapseSpacesVi(cand);
            const candNoTone = stripVietnameseTones(c);
            const candStripped = stripOptionalClassifier(c);
            if (user === c) return true;
            if (userNoTone === candNoTone) return true;
            if (userStripped === candStripped) return true;
            if (stripVietnameseTones(userStripped) === stripVietnameseTones(candStripped)) return true;
            return false;
        }

        function buildWriteViAcceptByEn(allWords) {
            const multiFirstToneless = new Map();
            for (const w of allWords) {
                for (const phrase of getViAcceptablePhrases(w.vi)) {
                    const c = collapseSpacesVi(phrase);
                    const toks = c.split(/\s+/).filter(Boolean);
                    if (toks.length < 2 || isViClassifierToken(toks[0])) continue;
                    const k = stripVietnameseTones(toks[0]);
                    if (!multiFirstToneless.has(k)) multiFirstToneless.set(k, new Set());
                    multiFirstToneless.get(k).add(getWordKey(w));
                }
            }
            const conflictFirstToneless = new Set();
            for (const [k, ens] of multiFirstToneless) {
                if (ens.size > 1) conflictFirstToneless.add(k);
            }

            const relaxedByEn = new Map();
            for (const w of allWords) {
                const extras = [];
                for (const phrase of getViAcceptablePhrases(w.vi)) {
                    const c = collapseSpacesVi(phrase);
                    const toks = c.split(/\s+/).filter(Boolean);
                    if (toks.length < 2) continue;
                    const first = toks[0];
                    const last = toks[toks.length - 1];
                    if (isViClassifierToken(first)) {
                        if (last) extras.push(last);
                    } else {
                        if (
                            !VI_DENY_FIRST_RELAX_EN.has(w.en) &&
                            !conflictFirstToneless.has(stripVietnameseTones(first)) &&
                            !VI_BLOCK_FIRST_TOKEN_TONELESS.has(stripVietnameseTones(first))
                        ) {
                            extras.push(first);
                        }
                    }
                }
                const manual = VI_MANUAL_WRITE_EXTRA_BY_EN[w.en];
                if (manual) manual.forEach((x) => extras.push(x));
                relaxedByEn.set(getWordKey(w), [...new Set(extras.map((x) => collapseSpacesVi(x)))]);
            }

            const byWordKey = new Map();
            for (const w of allWords) {
                const key = getWordKey(w);
                const set = new Set();
                for (const phrase of getViAcceptablePhrases(w.vi)) {
                    const c = collapseSpacesVi(phrase);
                    set.add(c);
                    const stripped = stripOptionalClassifier(c);
                    if (stripped) set.add(stripped);
                }
                for (const x of relaxedByEn.get(key) || []) {
                    if (x) set.add(x);
                }
                byWordKey.set(key, set);
            }
            return byWordKey;
        }

        const VI_WRITE_ACCEPT_BY_EN = buildWriteViAcceptByEn(vocabularyData.flatMap((u) => u.words));

        function viWritingMatches(userInput, targetVi, wordKey) {
            const user = collapseSpacesVi(String(userInput).replace(/\s*\/\s*/g, '/'));
            if (!user) return false;

            const userNoTone = stripVietnameseTones(user);
            const userStripped = stripOptionalClassifier(user);

            const fromCache = wordKey != null ? VI_WRITE_ACCEPT_BY_EN.get(wordKey) : null;
            if (fromCache && fromCache.size) {
                for (const cand of fromCache) {
                    if (viCandidateMatchesUser(user, userNoTone, userStripped, cand)) return true;
                }
            }

            const phrases = getViAcceptablePhrases(targetVi);
            for (const phrase of phrases) {
                if (viCandidateMatchesUser(user, userNoTone, userStripped, phrase)) return true;
            }
            return false;
        }

        function App() {
            const [activeUnit, setActiveUnit] = useState(1);
            const [mode, setMode] = useState('learn'); // 'learn', 'quiz', 'write-en', 'write-vi'
            const [quizQuestion, setQuizQuestion] = useState(null);
            const [writingQueue, setWritingQueue] = useState([]);
            const [writingIdx, setWritingIdx] = useState(0);
            const [userInput, setUserInput] = useState('');
            const [score, setScore] = useState(0);
            const [feedback, setFeedback] = useState(null);
            const [isLocked, setIsLocked] = useState(false);

            // Gom tất cả từ vựng từ tất cả các Unit vào 1 mảng duy nhất để kiểm tra viết
            const allWords = useMemo(() => vocabularyData.flatMap(u => u.words), []);

            const writingQuestion =
                writingQueue.length > 0
                    ? writingQueue[Math.min(writingIdx, writingQueue.length - 1)]
                    : null;

            const currentWords = useMemo(() => {
                return vocabularyData.find(u => u.unit === activeUnit).words;
            }, [activeUnit]);

            const speak = (text) => {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                window.speechSynthesis.speak(utterance);
            };

            const startQuiz = () => {
                const randomWord = currentWords[Math.floor(Math.random() * currentWords.length)];
                const others = vocabularyData
                    .flatMap(u => u.words)
                    .filter(w => getWordKey(w) !== getWordKey(randomWord))
                    .sort(() => 0.5 - Math.random())
                    .slice(0, 3);
                
                const options = [randomWord, ...others].sort(() => 0.5 - Math.random());
                setQuizQuestion({ correct: randomWord, options });
                setFeedback(null);
            };

            useEffect(() => {
                if (mode === 'quiz') startQuiz();
                if (mode === 'write-en' || mode === 'write-vi') {
                    setWritingQueue(shuffleArray(allWords));
                    setWritingIdx(0);
                    setUserInput('');
                    setFeedback(null);
                    setIsLocked(false);
                }
            }, [mode, activeUnit, allWords]);

            const handleAnswer = (word) => {
                if (getWordKey(word) === getWordKey(quizQuestion.correct)) {
                    setScore(s => s + 10);
                    setFeedback({ type: 'success', msg: 'Chính xác! Giỏi quá! 🎉' });
                    speak(word.en);
                    setTimeout(startQuiz, 1500);
                } else {
                    setFeedback({ type: 'error', msg: 'Thử lại nhé bé ơi! 💪' });
                }
            };

            const checkWriting = () => {
                if (isLocked || !writingQuestion) return;

                const isCorrect =
                    mode === 'write-en'
                        ? userInput.toLowerCase().trim() === writingQuestion.en.toLowerCase().trim()
                        : viWritingMatches(userInput, writingQuestion.vi, getWordKey(writingQuestion));

                if (isCorrect) {
                    setIsLocked(true);
                    const total = allWords.length;
                    const isLastInRound = writingIdx + 1 >= total;
                    setScore(s => s + 20);
                    setFeedback({
                        type: 'success',
                        msg: isLastInRound
                            ? 'Tuyệt vời! Bé vừa làm xong cả danh sách từ! 🎊 Lượt mới sắp bắt đầu...'
                            : 'Tuyệt vời! Bé viết đúng rồi! 🌟',
                    });

                    if (mode === 'write-en') speak(writingQuestion.en);
                    setTimeout(() => {
                        setIsLocked(false);
                        setUserInput('');
                        setFeedback(null);
                        setWritingIdx((prev) => {
                            const next = prev + 1;
                            if (next >= total) {
                                setWritingQueue(shuffleArray([...allWords]));
                                return 0;
                            }
                            return next;
                        });
                    }, 2000);
                } else {
                    setFeedback({ type: 'error', msg: 'Chưa đúng rồi, bé kiểm tra lại nhé! ✍️' });
                }
            };

            const writeTotal = writingQueue.length || 1;
            const writeCompletedDisp =
                isLocked && feedback?.type === 'success' ? writingIdx + 1 : writingIdx;
            const writeBarPct = Math.min(100, (writeCompletedDisp / writeTotal) * 100);
            const writeCurrentNum = Math.min(writingIdx + 1, writeTotal);
            const writeBarClass = mode === 'write-vi' ? 'bg-orange-500' : 'bg-purple-500';
            const writeTextClass = mode === 'write-vi' ? 'text-orange-600' : 'text-purple-600';

            return (
                <div className="min-h-screen pb-10">
                    {/* Header */}
                    <header className="bg-yellow-400 p-6 text-center shadow-lg rounded-b-3xl">
                        <h1 className="text-3xl md:text-4xl font-bold text-white drop-shadow-md">
                             🌟 BÉ HỌC TIẾNG ANH 🌟
                        </h1>
                        <div className="flex justify-center items-center gap-4 mt-2">
                            <p className="text-yellow-900 font-semibold">Cùng vui học mỗi ngày!</p>
                            <span className="bg-white text-orange-500 px-4 py-1 rounded-full font-bold shadow-sm">
                                Điểm: {score}
                            </span>
                        </div>
                    </header>

                    {/* Navigation */}
                    <div className="container mx-auto px-4 mt-6">
                        {/* Unit Selector - Chỉ hiện ở chế độ Học và Quiz Unit */}
                        {(mode === 'learn' || mode === 'quiz') && (
                            <div className="flex flex-wrap justify-center gap-2 mb-8">
                                {vocabularyData.map(u => (
                                    <button 
                                        key={u.unit}
                                        onClick={() => setActiveUnit(u.unit)}
                                        className={`px-4 py-2 rounded-full font-bold shadow-md transition-all ${activeUnit === u.unit ? 'unit-btn-active' : 'bg-white text-blue-500'}`}
                                    >
                                        Unit {u.unit}
                                    </button>
                                ))}
                            </div>
                        )}

                        {/* Mode Switcher */}
                        <div className="flex flex-wrap justify-center gap-3 mb-8">
                            <button 
                                onClick={() => setMode('learn')}
                                className={`flex items-center gap-2 px-4 py-2 rounded-2xl font-bold transition-all ${mode === 'learn' ? 'bg-blue-500 text-white shadow-lg scale-105' : 'bg-white text-blue-500 border-2 border-blue-500'}`}
                            >
                                📖 Học
                            </button>
                            <button 
                                onClick={() => setMode('quiz')}
                                className={`flex items-center gap-2 px-4 py-2 rounded-2xl font-bold transition-all ${mode === 'quiz' ? 'bg-green-500 text-white shadow-lg scale-105' : 'bg-white text-green-500 border-2 border-green-500'}`}
                            >
                                🎮 Chơi
                            </button>
                            <button 
                                onClick={() => setMode('write-en')}
                                className={`flex items-center gap-2 px-4 py-2 rounded-2xl font-bold transition-all ${mode === 'write-en' ? 'bg-purple-500 text-white shadow-lg scale-105' : 'bg-white text-purple-500 border-2 border-purple-500'}`}
                            >
                                ✍️ Viết Anh
                            </button>
                            <button 
                                onClick={() => setMode('write-vi')}
                                className={`flex items-center gap-2 px-4 py-2 rounded-2xl font-bold transition-all ${mode === 'write-vi' ? 'bg-orange-500 text-white shadow-lg scale-105' : 'bg-white text-orange-500 border-2 border-orange-500'}`}
                            >
                                ✍️ Viết Việt
                            </button>
                        </div>

                        {/* Content Area */}
                        <div className="mb-6 text-center">
                            {mode === 'learn' || mode === 'quiz' ? (
                                <h2 className="text-2xl font-bold text-gray-700">
                                    Unit {activeUnit}: {vocabularyData.find(u => u.unit === activeUnit).title}
                                </h2>
                            ) : (
                                <div className="max-w-xl mx-auto">
                                    <h2 className="text-2xl font-bold text-gray-700 mb-2">
                                        {mode === 'write-en' ? '✍️ Kiểm tra viết — Tiếng Anh' : '✍️ Kiểm tra viết — Tiếng Việt'}
                                    </h2>
                                    <p className="text-sm text-gray-500 mb-4">
                                        Toàn bộ từ vựng · một lượt gồm <span className="font-semibold text-gray-700">{writeTotal}</span> câu (xáo trộn thứ tự)
                                    </p>
                                    <div className="flex items-center gap-4 mb-2">
                                        <div className="flex-1 bg-gray-200 rounded-full h-4 overflow-hidden shadow-inner">
                                            <div
                                                className={`${writeBarClass} h-full transition-all duration-500 ease-out`}
                                                style={{ width: `${writeBarPct}%` }}
                                            />
                                        </div>
                                        <span className={`font-bold ${writeTextClass} whitespace-nowrap text-lg tabular-nums`}>
                                            Câu {writeCurrentNum}/{writeTotal}
                                        </span>
                                    </div>
                                    <p className="text-sm text-gray-600">
                                        Đã làm đúng <span className={`font-bold ${writeTextClass}`}>{writeCompletedDisp}</span> / {writeTotal} câu trong lượt này
                                    </p>
                                    <p className="text-xs text-gray-400 italic mt-1">Làm đúng hết {writeTotal} câu sẽ xáo trộn và bắt đầu lượt mới.</p>
                                </div>
                            )}
                        </div>

                        {mode === 'learn' && (
                            <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6">
                                {currentWords.map((word) => (
                                    <div 
                                        key={getWordKey(word)}
                                        onClick={() => speak(word.en)}
                                        className="bg-white p-4 rounded-3xl shadow-md card-bounce cursor-pointer flex flex-col items-center border-b-4 border-blue-200"
                                    >
                                        <span className="text-5xl mb-3">{word.icon}</span>
                                        <h3 className="text-xl font-bold text-blue-600 uppercase tracking-wide">{word.en}</h3>
                                        <p className="text-gray-500 italic text-sm">{word.vi}</p>
                                        <button className="mt-3 bg-blue-100 p-2 rounded-full">🔊</button>
                                    </div>
                                ))}
                            </div>
                        )}

                        {mode === 'quiz' && (
                            <div className="max-w-2xl mx-auto bg-white p-8 rounded-3xl shadow-xl border-t-8 border-green-400">
                                {quizQuestion && (
                                    <div className="text-center">
                                        <p className="text-gray-500 mb-2 uppercase font-bold">Bé hãy chọn hình của từ:</p>
                                        <div className="flex flex-wrap justify-center items-center gap-3 mb-8">
                                            <h3 className="text-4xl font-black text-green-600 uppercase">{quizQuestion.correct.en}</h3>
                                            <span className="text-6xl leading-none" title="Gợi ý nghĩa" aria-hidden="true">
                                                {(quizQuestion.correct.icon && String(quizQuestion.correct.icon).trim()) || '❔'}
                                            </span>
                                        </div>
                                        <div className="grid grid-cols-2 gap-4">
                                            {quizQuestion.options.map((opt, i) => (
                                                <button
                                                    key={`${getWordKey(opt)}-${i}`}
                                                    onClick={() => handleAnswer(opt)}
                                                    className="quiz-option bg-gray-50 border-4 border-gray-100 hover:border-green-300 p-8 rounded-3xl text-6xl shadow-sm transition-all"
                                                >
                                                    {(opt.icon && String(opt.icon).trim()) || '❔'}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {(mode === 'write-en' || mode === 'write-vi') && (
                            <div className="max-w-xl mx-auto bg-white p-10 rounded-3xl shadow-xl border-t-8 border-purple-400 text-center">
                                {!writingQuestion ? (
                                    <p className="text-gray-500 font-semibold">Đang chuẩn bị câu hỏi…</p>
                                ) : (
                                    <div>
                                        <p className="text-gray-500 mb-4 font-bold uppercase tracking-widest">
                                            {mode === 'write-en' ? 'Hãy viết từ này bằng Tiếng Anh:' : 'Hãy viết từ này bằng Tiếng Việt:'}
                                        </p>
                                        
                                        <div className="bg-gray-100 py-8 px-4 rounded-2xl mb-8 flex flex-col items-center gap-3">
                                            {(writingQuestion.icon && String(writingQuestion.icon).trim()) ? (
                                                <span className="text-6xl leading-none" title="Gợi ý" aria-hidden="true">
                                                    {String(writingQuestion.icon).trim()}
                                                </span>
                                            ) : null}
                                            <h3 className="text-5xl font-black text-purple-600 break-words max-w-full">
                                                {mode === 'write-en' ? writingQuestion.vi : writingQuestion.en}
                                            </h3>
                                            {mode === 'write-vi' ? (
                                                <p className="text-sm text-gray-500 max-w-md">
                                                    Icon gợi ý nghĩa khi nhiều từ cùng chữ tiếng Anh.
                                                </p>
                                            ) : null}
                                        </div>

                                        <input 
                                            type="text"
                                            value={userInput}
                                            onChange={(e) => setUserInput(e.target.value)}
                                            onKeyPress={(e) => e.key === 'Enter' && checkWriting()}
                                            placeholder="Nhập câu trả lời..."
                                            className="writing-input w-full p-5 text-2xl text-center font-bold border-4 border-gray-200 rounded-2xl mb-6 transition-all"
                                            autoFocus
                                        />

                                        <button 
                                            onClick={checkWriting}
                                            disabled={isLocked}
                                            className={`w-full text-white text-2xl font-bold py-4 rounded-2xl shadow-lg transition-transform active:scale-95 ${isLocked ? 'bg-gray-400 cursor-not-allowed' : 'bg-purple-500 hover:bg-purple-600'}`}
                                        >
                                            {isLocked ? 'Đang chuyển câu...' : 'Kiểm tra ✅'}
                                        </button>
                                        
                                        <div className="mt-4 text-sm text-gray-400">
                                            Có icon gợi ý khi cần phân biệt các từ trùng chữ tiếng Anh.
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* Global Feedback Message */}
                        {feedback && (
                            <div className={`mt-8 max-w-md mx-auto p-4 rounded-2xl font-bold text-center text-lg animate-bounce shadow-md ${feedback.type === 'success' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`}>
                                {feedback.msg}
                            </div>
                        )}
                    </div>

                    {/* Footer */}
                    <footer className="fixed bottom-0 w-full bg-white border-t p-2 text-center text-xs text-gray-400">
                        Nội dung từ Unit 1-12 | Kiểm tra viết: một lượt qua toàn bộ từ (có icon gợi ý khi trùng chữ).
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
